openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: M International AI Quote Agent operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: operations
    description: RFQ and operations monitoring
  - name: ingestion
    description: Email ingestion and AI processing
  - name: integrations
    description: External service connections
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [operations]
      summary: Get operations dashboard
      responses:
        "200":
          description: Dashboard summary and activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /rfqs:
    get:
      operationId: listRfqs
      tags: [operations]
      summary: List RFQs
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/RequestType"
        - $ref: "#/components/parameters/Priority"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: RFQ list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rfq"
  /rfqs/{rfqId}:
    get:
      operationId: getRfq
      tags: [operations]
      summary: Get an RFQ
      parameters:
        - $ref: "#/components/parameters/RfqId"
      responses:
        "200":
          description: RFQ details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqDetail"
        "404":
          description: RFQ not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /emails:
    get:
      operationId: listEmails
      tags: [operations]
      summary: List ingested emails
      responses:
        "200":
          description: Email list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Email"
  /emails/{emailId}:
    get:
      operationId: getEmail
      tags: [ingestion]
      summary: Get an email and its processing details
      parameters:
        - $ref: "#/components/parameters/EmailId"
      responses:
        "200":
          description: Email detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDetail"
        "404":
          description: Email not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /emails/sync:
    post:
      operationId: syncEmails
      tags: [ingestion]
      summary: Synchronize inbox email
      responses:
        "200":
          description: Synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSyncResult"
  /emails/{emailId}/process:
    post:
      operationId: processEmail
      tags: [ingestion]
      summary: Process an email through the RFQ analysis pipeline
      parameters:
        - $ref: "#/components/parameters/EmailId"
      responses:
        "200":
          description: Processing result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailProcessResult"
        "404":
          description: Email not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /email-attachments/{attachmentId}:
    get:
      operationId: getEmailAttachment
      tags: [ingestion]
      summary: Get attachment metadata
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAttachment"
        "404":
          description: Attachment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai-review:
    get:
      operationId: listAiReviews
      tags: [operations]
      summary: List requests needing human review
      responses:
        "200":
          description: AI review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiReview"
  /ai-review/{rfqId}:
    get:
      operationId: getAiReview
      tags: [ingestion]
      summary: Get AI review detail
      parameters:
        - $ref: "#/components/parameters/RfqId"
      responses:
        "200":
          description: AI review detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReviewDetail"
        "404":
          description: Review item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai-review/{rfqId}/approve:
    post:
      operationId: approveAiReview
      tags: [ingestion]
      summary: Approve an AI result
      parameters:
        - $ref: "#/components/parameters/RfqId"
      responses:
        "200":
          description: Updated AI review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReviewDetail"
  /ai-review/{rfqId}/reclassify:
    post:
      operationId: reclassifyAiReview
      tags: [ingestion]
      summary: Change the request classification
      parameters:
        - $ref: "#/components/parameters/RfqId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReclassifyReviewInput"
      responses:
        "200":
          description: Updated AI review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReviewDetail"
  /ai-review/{rfqId}/reject:
    post:
      operationId: rejectAiReview
      tags: [ingestion]
      summary: Reject an AI result as non-RFQ
      parameters:
        - $ref: "#/components/parameters/RfqId"
      responses:
        "200":
          description: Updated AI review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReviewDetail"
  /ai-review/{rfqId}/update:
    post:
      operationId: updateAiReview
      tags: [ingestion]
      summary: Edit extracted RFQ details
      parameters:
        - $ref: "#/components/parameters/RfqId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewInput"
      responses:
        "200":
          description: Updated AI review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReviewDetail"
  /ai-review/{rfqId}/action:
    post:
      operationId: reviewAi
      tags: [operations]
      summary: Apply a review queue action
      parameters:
        - $ref: "#/components/parameters/RfqId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiReviewAction"
      responses:
        "200":
          description: Updated review item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReview"
        "404":
          description: RFQ not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /integrations/microsoft/status:
    get:
      operationId: getMicrosoftStatus
      tags: [integrations]
      summary: Get Microsoft 365 connection status
      responses:
        "200":
          description: Microsoft 365 connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicrosoftIntegrationStatus"
  /integrations/microsoft/connect:
    get:
      operationId: getMicrosoftConnect
      tags: [integrations]
      summary: Start Microsoft 365 connection
      responses:
        "200":
          description: Connection status or setup guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicrosoftIntegrationStatus"
  /integrations/microsoft/callback:
    get:
      operationId: microsoftCallback
      tags: [integrations]
      summary: Complete Microsoft 365 connection callback
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicrosoftIntegrationStatus"
  /integrations/microsoft/disconnect:
    post:
      operationId: disconnectMicrosoft
      tags: [integrations]
      summary: Disconnect Microsoft 365
      responses:
        "200":
          description: Disconnection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicrosoftIntegrationStatus"
components:
  parameters:
    RfqId:
      name: rfqId
      in: path
      required: true
      schema:
        type: integer
    EmailId:
      name: emailId
      in: path
      required: true
      schema:
        type: integer
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: integer
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Source:
      name: source
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/RfqSource"
    RequestType:
      name: requestType
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/RequestType"
    Priority:
      name: priority
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Priority"
    Status:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/RfqStatus"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    RfqSource:
      type: string
      enum: [EMAIL, WEBSITE, PHONE, PORTAL]
    RequestType:
      type: string
      enum: [PARTS_EXCHANGE, NEW_PART_PURCHASE, REPAIR, OVERHAUL, INSPECTION, UNKNOWN]
    RfqStatus:
      type: string
      enum: [NEW, ANALYZING, UNDER_REVIEW, PROCESSING, NEEDS_HUMAN_REVIEW, COMPLETED, CLOSED]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
    SummaryMetric:
      type: object
      properties:
        label:
          type: string
        value:
          type: integer
        trend:
          type: number
        tone:
          type: string
          enum: [blue, amber, violet, orange, green, teal, slate]
      required: [label, value, trend, tone]
    Rfq:
      type: object
      properties:
        id:
          type: integer
        rfqNumber:
          type: string
        customer:
          type: string
        customerCompany:
          type: string
        partNumber:
          type: string
        source:
          $ref: "#/components/schemas/RfqSource"
        requestType:
          $ref: "#/components/schemas/RequestType"
        confidence:
          type: integer
        priority:
          $ref: "#/components/schemas/Priority"
        status:
          $ref: "#/components/schemas/RfqStatus"
        createdAt:
          type: string
        age:
          type: string
      required: [id, rfqNumber, customer, customerCompany, partNumber, source, requestType, confidence, priority, status, createdAt, age]
    RfqDetail:
      allOf:
        - $ref: "#/components/schemas/Rfq"
        - type: object
          properties:
            description:
              type: string
            quantity:
              type: integer
            aircraft:
              type: string
            notes:
              type: string
            emailSubject:
              type: string
            sender:
              type: string
            sourceEmail:
              oneOf:
                - $ref: "#/components/schemas/EmailDetail"
                - type: "null"
            analysis:
              oneOf:
                - $ref: "#/components/schemas/AiAnalysis"
                - type: "null"
            reviewHistory:
              type: array
              items:
                $ref: "#/components/schemas/ReviewHistoryEntry"
          required: [description, quantity, aircraft, notes, emailSubject, sender]
    Email:
      type: object
      properties:
        id:
          type: integer
        sender:
          type: string
        senderEmail:
          type: string
        subject:
          type: string
        receivedAt:
          type: string
        aiStatus:
          type: string
          enum: [ANALYZED, PROCESSING, FAILED]
        requestType:
          $ref: "#/components/schemas/RequestType"
        confidence:
          type: integer
        status:
          type: string
          enum: [RFQ_CREATED, PENDING_REVIEW, IGNORED]
      required: [id, sender, senderEmail, subject, receivedAt, aiStatus, requestType, confidence, status]
    EmailClassification:
      type: string
      enum: [RFQ, NON_RFQ, SUPPLIER_RESPONSE, CUSTOMER_INQUIRY, INTERNAL, UNKNOWN]
    ProcessingStatus:
      type: string
      enum: [NEW, SYNCED, PROCESSING, PROCESSED, REVIEW_REQUIRED, FAILED, IGNORED]
    AttachmentProcessingStatus:
      type: string
      enum: [PENDING, PROCESSING, EXTRACTED, FAILED, UNSUPPORTED]
    EmailAttachment:
      type: object
      properties:
        id:
          type: integer
        emailId:
          type: integer
        fileName:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
        processingStatus:
          $ref: "#/components/schemas/AttachmentProcessingStatus"
        extractedText:
          type: ["string", "null"]
      required: [id, emailId, fileName, contentType, fileSize, processingStatus, extractedText]
    AiAnalysis:
      type: object
      properties:
        id:
          type: integer
        emailClassification:
          $ref: "#/components/schemas/EmailClassification"
        requestType:
          $ref: "#/components/schemas/RequestType"
        confidenceScore:
          type: number
        reasoningSummary:
          type: string
        requiresHumanReview:
          type: boolean
        developmentMode:
          type: boolean
        extractedData:
          type: object
          additionalProperties: true
      required: [id, emailClassification, requestType, confidenceScore, reasoningSummary, requiresHumanReview, developmentMode, extractedData]
    ReviewHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
          enum: [APPROVED, REJECTED, RECLASSIFIED, EDITED]
        previousClassification:
          $ref: "#/components/schemas/RequestType"
        newClassification:
          $ref: "#/components/schemas/RequestType"
        notes:
          type: string
        createdAt:
          type: string
      required: [id, action, previousClassification, newClassification, notes, createdAt]
    EmailDetail:
      allOf:
        - $ref: "#/components/schemas/Email"
        - type: object
          properties:
            recipient:
              type: string
            cc:
              type: string
            bodyText:
              type: string
            bodyHtml:
              type: string
            processingStatus:
              $ref: "#/components/schemas/ProcessingStatus"
            emailClassification:
              $ref: "#/components/schemas/EmailClassification"
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/EmailAttachment"
            analysis:
              oneOf:
                - $ref: "#/components/schemas/AiAnalysis"
                - type: "null"
            linkedRfq:
              oneOf:
                - $ref: "#/components/schemas/Rfq"
                - type: "null"
          required: [recipient, cc, bodyText, bodyHtml, processingStatus, emailClassification, attachments, analysis, linkedRfq]
    EmailSyncResult:
      type: object
      properties:
        mode:
          type: string
          enum: [MICROSOFT_GRAPH, DEVELOPMENT]
        synced:
          type: integer
        duplicatesSkipped:
          type: integer
        failed:
          type: integer
        message:
          type: string
      required: [mode, synced, duplicatesSkipped, failed, message]
    EmailProcessResult:
      type: object
      properties:
        email:
          $ref: "#/components/schemas/EmailDetail"
        rfqCreated:
          type: boolean
        reviewRequired:
          type: boolean
        message:
          type: string
      required: [email, rfqCreated, reviewRequired, message]
    AiReviewDetail:
      allOf:
        - $ref: "#/components/schemas/AiReview"
        - type: object
          properties:
            emailSubject:
              type: string
            createdAt:
              type: string
            originalEmail:
              $ref: "#/components/schemas/EmailDetail"
            analysis:
              $ref: "#/components/schemas/AiAnalysis"
            reviewHistory:
              type: array
              items:
                $ref: "#/components/schemas/ReviewHistoryEntry"
          required: [emailSubject, createdAt, originalEmail, analysis, reviewHistory]
    ReclassifyReviewInput:
      type: object
      properties:
        requestType:
          $ref: "#/components/schemas/RequestType"
        notes:
          type: string
      required: [requestType]
    UpdateReviewInput:
      type: object
      properties:
        customer:
          type: string
        partNumber:
          type: string
        description:
          type: string
        quantity:
          type: integer
        condition:
          type: string
        requestType:
          $ref: "#/components/schemas/RequestType"
        priority:
          $ref: "#/components/schemas/Priority"
        notes:
          type: string
      required: []
    MicrosoftIntegrationStatus:
      type: object
      properties:
        connected:
          type: boolean
        mailbox:
          type: ["string", "null"]
        lastSync:
          type: ["string", "null"]
        message:
          type: string
        configured:
          type: boolean
        developmentMode:
          type: boolean
      required: [connected, mailbox, lastSync, message, configured, developmentMode]
    AiReview:
      type: object
      properties:
        id:
          type: integer
        rfqId:
          type: integer
        rfqNumber:
          type: string
        customer:
          type: string
        classification:
          $ref: "#/components/schemas/RequestType"
        confidence:
          type: integer
        reason:
          type: string
        status:
          type: string
          enum: [NEEDS_REVIEW, APPROVED, CHANGED]
      required: [id, rfqId, rfqNumber, customer, classification, confidence, reason, status]
    AiReviewAction:
      type: object
      properties:
        action:
          type: string
          enum: [REVIEW, APPROVE, CHANGE_CLASSIFICATION]
        requestType:
          $ref: "#/components/schemas/RequestType"
      required: [action]
    WorkflowStat:
      type: object
      properties:
        name:
          type: string
        active:
          type: integer
        total:
          type: integer
        progress:
          type: integer
        tone:
          type: string
          enum: [blue, teal, amber, violet]
      required: [name, active, total, progress, tone]
    Activity:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        title:
          type: string
        description:
          type: string
        time:
          type: string
        tone:
          type: string
          enum: [blue, violet, green, amber, slate]
      required: [id, type, title, description, time, tone]
    Dashboard:
      type: object
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/SummaryMetric"
        recentRfqs:
          type: array
          items:
            $ref: "#/components/schemas/Rfq"
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStat"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        emailPipeline:
          type: array
          items:
            $ref: "#/components/schemas/PipelineMetric"
      required: [metrics, recentRfqs, workflows, activities]
    PipelineMetric:
      type: object
      properties:
        label:
          type: string
        value:
          type: integer
        detail:
          type: string
      required: [label, value, detail]

